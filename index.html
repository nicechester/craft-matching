<html>
    <head>
        <meta charset="UTF-8">
        <title>Senior Craft Class - Volunteer Matching</title>
        <script src="https://cdn.jsdelivr.net/gh/rufuspollock/csv.js/csv.min.js"></script>
        <link rel="stylesheet" type="text/css" href="craft.css">
    </head>
    <body>
        <h1>Senior Craft Class - Volunteer Matching</h1>
        <div class="file-input-container">
            <input type="file" id="csvFile" accept=".csv" style="display:none">
            <label id="drop-zone" for="csvFile">
            Drop file here or click to select
            </label>
            <ul id="preview"></ul>
            <button id="clear-btn">Clear</button>
        </div>
        <div id="results"></div>
        <script src="match.js"></script>
        <script src="process_csv.js"></script>
        <script src="drophandler.js"></script>

        <table id="match-table">
            <thead>
                <tr>
                    <th>Volunteer</th>
                    <th>Volunteer Email</th>
                    <th>Senior</th>
                    <th>Senior Email</th>
                    <th>Score</th>
                </tr>
            </thead>
            <tbody id="match-tbody"></tbody>
        </table>

        <template id="match-row-template">
            <tr>
                <td class="volunteer"></td>
                <td class="volunteer-email"></td>
                <td class="senior"></td>
                <td class="senior-email"></td>
                <td class="score"></td>
            </tr>
        </template>
    </body>
</html>
