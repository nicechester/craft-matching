<html>
    <head>
        <title>Senior Craft Class - Volunteer Matching</title>
        <script src="https://cdn.jsdelivr.net/gh/rufuspollock/csv.js/csv.min.js"></script>
    </head>
    <body>
        <h1>Senior Craft Class - Volunteer Matching</h1>
        <div class="file-input-container">
            <input type="file" name="csvFile" id="csvFile" accept=".csv">
            <label for="csvFile">Choose CSV File</label>
        </div>
        <button id="matchBtn">Load &amp; Match</button>
        <div id="results"></div>
        <script src="match.js"></script>
        <script src="process_csv.js"></script>

        <table id="match-table">
            <thead>
                <tr>
                    <th>Volunteer</th>
                    <th>Volunteer Email</th>
                    <th>Senior</th>
                    <th>Senior Email</th>
                    <th>Score</th>
                </tr>
            </thead>
            <tbody id="match-tbody"></tbody>
        </table>

        <template id="match-row-template">
            <tr>
                <td class="volunteer"></td>
                <td class="volunteer-email"></td>
                <td class="senior"></td>
                <td class="senior-email"></td>
                <td class="score"></td>
            </tr>
        </template>
    </body>
</html>
